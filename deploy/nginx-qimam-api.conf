# Nginx site for the API. Replace api.example.com with your subdomain, then:
#   sudo cp deploy/nginx-qimam-api.conf /etc/nginx/sites-available/qimam-api
#   sudo ln -s /etc/nginx/sites-available/qimam-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.example.com     (adds HTTPS and the redirect)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # The largest upload is a 20 MB recording or translation file.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSockets: /v1/voice and /v1/support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep idle WebSocket connections open during a session.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
